services:
  app:
    container_name: inu-teamflow-dev
    image: ${DOCKER_USERNAME}/inu-teamflow:dev
    ports:
      - "8152:8080"
    volumes:
      - ./logs:/var/log/spring
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRESQL_URL: ${POSTGRESQL_URL}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      ORACLE_URL: ${ORACLE_URL}
      ORACLE_USERNAME: ${ORACLE_USERNAME}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY}
      TZ: ${TZ}
    restart: unless-stopped
    networks:
      - inu-teamflow-dev

  loki:
    container_name: inu-teamflow-loki-dev
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - inu-teamflow-dev

  alloy:
    container_name: inu-teamflow-alloy-dev
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      APP_ENV: dev
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/inu-teamflow:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - inu-teamflow-dev

networks:
  inu-teamflow-dev:
    external: true
    name: inu-teamflow-dev

volumes:
  loki-data:
  alloy-data: