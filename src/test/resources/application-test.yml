spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    # 컨텍스트마다 별도 DB를 사용해, @DirtiesContext로 닫히는 컨텍스트의 create-drop이 캐시된 다른 컨텍스트의 테이블을 지우지 않도록 한다.
    url: jdbc:h2:mem:inu_teamflow_test_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: test-jwt-secret-key-for-context-loads-123456

aws:
  credentials:
    access-key: test-access-key
    secret-key: test-secret-key
  region:
    static: ap-northeast-2
  s3:
    bucket: test-bucket
  cloudfront:
    domain: test.cloudfront.net

ai:
  base-url: http://localhost:9999
  api-key: test-api-key
  model:
    classification: test-classification-model
    format: test-format-model

intip:
  base-url: http://localhost:9999