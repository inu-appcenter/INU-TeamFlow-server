plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'com.inuteamflow'
version = '0.0.1-SNAPSHOT'
description = 'INU-TeamFlow-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    implementation platform('software.amazon.awssdk:bom:2.27.21')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'software.amazon.awssdk:s3'

    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.2'

    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.8.0.25.04'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Flyway (DB 마이그레이션)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disable('MissingOverride')
}

spotless {

    // dev 브랜치와 비교했을 때 변경된 파일에 한에서 spotless 검사를 진행
    ratchetFrom 'origin/dev'

    java {
        target 'src/*/java/**/*.java'

        palantirJavaFormat('2.96.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// git pre-commit 훅 설치: 커밋 전 spotlessCheck 실행 (변경 파일만)
// 팀원은 클론 후 `./gradlew installGitHook`을 한 번 실행하면 됩니다.
tasks.register('installGitHook') {
    group = 'git hooks'
    description = 'Installs a pre-commit hook that runs spotlessCheck'
    doLast {
        def hooksDir = file("$rootDir/.git/hooks")
        if (!hooksDir.exists()) {
            logger.warn('[installGitHook] .git/hooks 디렉터리가 없어 훅 설치를 건너뜁니다.')
            return
        }
        def hookFile = new File(hooksDir, 'pre-commit')
        hookFile.setText('''#!/bin/sh
# Auto-generated by the 'installGitHook' Gradle task. Do not edit manually.
echo "[spotless] checking formatting on changed files..."
if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
"$GRADLE" spotlessCheck --daemon -q
if [ $? -ne 0 ]; then
  echo ""
  echo "[spotless] Formatting violations found."
  echo "[spotless] Run './gradlew spotlessApply', then 'git add' the changed files and commit again."
  exit 1
fi
exit 0
''', 'UTF-8')
        hookFile.setExecutable(true)
        logger.lifecycle("[installGitHook] pre-commit 훅 설치 완료: $hookFile")
    }
}
