plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'com.inuteamflow'
version = '0.0.1-SNAPSHOT'
description = 'INU-TeamFlow-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    implementation platform('software.amazon.awssdk:bom:2.27.21')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'software.amazon.awssdk:s3'

    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.2'

    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.8.0.25.04'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Flyway (DB 마이그레이션)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Logback
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disable('MissingOverride')
}

tasks.named('compileTestJava') {
    // @MockBean/@Mock 필드는 실제 외부 호출(S3, FCM 등)을 막기 위해 선언만 하고 검증에 사용하지 않는 경우가 많아 오탐이 발생
    options.errorprone.disable('UnusedVariable')

    // 테스트 픽스처의 상대 시간 계산(now().plusDays(7) 등)은 타임존과 무관하게 동작
    options.errorprone.disable('JavaTimeDefaultTimeZone')
}

spotless {

    // dev 브랜치와 비교했을 때 변경된 파일에 한에서 spotless 검사를 진행
    ratchetFrom 'origin/dev'

    java {
        target 'src/*/java/**/*.java'

        palantirJavaFormat('2.96.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// scripts/hooks 의 스크립트를 .git/hooks 로 복사하여 git 훅을 설치합니다.
//  - pre-commit: 커밋 전 spotlessCheck 실행 (변경 파일만)
//  - pre-push  : push 전 compileJava 실행 (Error Prone 정적 분석)
// 팀원은 클론 후 `./gradlew installGitHook`을 한 번 실행하면 됩니다.
// scripts/hooks 의 훅 스크립트를 수정하면 명령어를 다시 실행해야 합니다.
tasks.register('installGitHook', Copy) {
    group = 'git hooks'
    description = 'Installs pre-commit (spotlessCheck) and pre-push (Error Prone) hooks'

    def hooksDir = file("$rootDir/.git/hooks")
    onlyIf {
        boolean present = hooksDir.exists()
        if (!present) {
            logger.warn('[installGitHook] .git/hooks directory not found; skipping hook installation.')
        }
        present
    }

    from "$rootDir/scripts/hooks"
    into hooksDir
    filePermissions {
        unix("rwxr-xr-x")
    }

    doLast {
        logger.lifecycle("[installGitHook] Hooks installed into $hooksDir")
    }
}
