# dev, prod 로그를 함께 수집하는 서비스 단위 로그 스택 (서버: /home/serverking/inu-teamflow/logging)
name: inu-teamflow-logging

services:
  loki:
    container_name: inu-teamflow-loki
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - inu-teamflow-logging

  alloy:
    container_name: inu-teamflow-alloy
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../dev/logs:/var/log/inu-teamflow/dev:ro
      - ../prod/logs:/var/log/inu-teamflow/prod:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - inu-teamflow-logging

networks:
  inu-teamflow-logging:
    external: true
    name: inu-teamflow-logging

volumes:
  loki-data:
  alloy-data:
