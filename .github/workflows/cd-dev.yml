name: CD-DEV

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Make Firebase Admin Key
        run: |
          mkdir -p src/main/resources/firebase
          cat > src/main/resources/firebase/inu-teamflow-firebase-adminsdk.json << 'EOF'
          ${{ secrets.FCM_ADMIN_KEY }}
          EOF

      - name: Build
        run: |
          ./gradlew clean bootJar

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/inu-teamflow:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/inu-teamflow:dev

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /home/serverking/inu-teamflow/dev

      - name: Copy compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose-dev.yml"
          target: "/home/serverking/inu-teamflow/dev"

      - name: Deploy dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/serverking/inu-teamflow/dev

            cat > .env <<'EOF'
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            SPRING_PROFILES_ACTIVE=dev
            POSTGRESQL_URL=${{ secrets.DEV_POSTGRESQL_URL }}
            POSTGRESQL_USERNAME=${{ secrets.DEV_POSTGRESQL_USERNAME }}
            POSTGRESQL_PASSWORD=${{ secrets.DEV_POSTGRESQL_PASSWORD }}
            ORACLE_URL=${{ secrets.ORACLE_URL }}
            ORACLE_USERNAME=${{ secrets.ORACLE_USERNAME }}
            ORACLE_PASSWORD=${{ secrets.ORACLE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
            FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            AI_SERVER_API_KEY=${{ secrets.AI_SERVER_API_KEY }}
            TZ=Asia/Seoul
            EOF
            
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            docker compose -f docker-compose-dev.yml pull
            docker compose -f docker-compose-dev.yml up -d --force-recreate
            docker image prune -f
